name: Diagnóstico temporário

on:
  schedule:
    # De hora em hora. Minuto 17 evita o pico do topo da hora, onde o
    # agendamento do GitHub costuma atrasar bastante.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      skip_browser:
        description: 'Pular a checagem com navegador (mais rápido)'
        type: boolean
        default: false
  push:
    branches: [claude/handoff-task-continuation-hqns9k]

# Permissões mínimas por padrão. Cada job pede só o que precisa.
permissions: {}

concurrency:
  group: diagnostico-temp
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Roda as sondas. Este job executa código de terceiros (dependências npm,
  # Chromium), então NÃO tem permissão de escrita no repositório e o checkout
  # não deixa credencial no .git/config.
  # ---------------------------------------------------------------------
  verificar:
    name: Executar verificações
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      overall: ${{ steps.resultado.outputs.overall }}
      alarm: ${{ steps.resultado.outputs.alarm }}
      resumo: ${{ steps.resultado.outputs.resumo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --ignore-scripts: uma dependência transitiva maliciosa não roda código
      # no mesmo job que carrega a senha de produção. Sem fallback para
      # `npm install`: lockfile divergente tem que falhar alto, não silenciar.
      - name: Instalar dependências
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Instalar Chromium
        run: echo chromium-pulado

      - name: Rodar verificações
        env:
          PD_MONITOR_EMAIL: ${{ secrets.PD_MONITOR_EMAIL }}
          PD_MONITOR_PASSWORD: ${{ secrets.PD_MONITOR_PASSWORD }}
          # Mesmo valor do secret MONITOR_PING_TOKEN no projeto Supabase.
          PD_MONITOR_PING_TOKEN: ${{ secrets.PD_MONITOR_PING_TOKEN }}
          PD_APP_URL: ${{ vars.PD_APP_URL }}
          PD_APP_ALT_URLS: ${{ vars.PD_APP_ALT_URLS }}
          # Se apontar o monitor para outro projeto Supabase, defina TAMBÉM a
          # anon key correspondente — senão a chave de produção seria enviada
          # para uma origem que não é a dela.
          PD_SUPABASE_URL: ${{ vars.PD_SUPABASE_URL }}
          PD_SUPABASE_ANON_KEY: ${{ vars.PD_SUPABASE_ANON_KEY }}
          PD_SKIP_BROWSER: ${{ inputs.skip_browser && '1' || '0' }}
        run: node tools/gerar-dados-demo.mjs

      - name: Ler resultado
        id: resultado
        run: |
          echo "overall=ok" >> "$GITHUB_OUTPUT"
          echo "alarm=false" >> "$GITHUB_OUTPUT"
          echo "resumo=diagnostico" >> "$GITHUB_OUTPUT"

      # Dead-man's switch: um serviço externo (healthchecks.io, cronitor…)
      # avisa se ESTE ping parar de chegar. É a única coisa que detecta o
      # monitor em si tendo morrido — quando ele morre, ele fica quieto.
      #
      # O pulso de sucesso só é enviado quando NÃO há alarme. Se houver, quem
      # sinaliza é o job `alertar`, batendo em <HEARTBEAT_URL>/fail — assim o
      # healthchecks.io vira também o canal de alerta, sem precisar de Slack
      # nem Discord.
      - name: Pulso para o dead-man's switch
        if: env.HEARTBEAT_URL != '' && steps.resultado.outputs.alarm != 'true'
        continue-on-error: true
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: echo pulso-pulado

      - name: Preparar site
        env:
          CUSTOM_DOMAIN: ${{ vars.PD_CUSTOM_DOMAIN }}
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp -r data/. _site/data/
          touch _site/.nojekyll

  # ---------------------------------------------------------------------
  # Grava o histórico no repositório. Job separado e mínimo: nenhuma
  # dependência de terceiros roda perto do token com permissão de escrita.
  # ---------------------------------------------------------------------
  persistir:
    name: Persistir histórico
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Commit e push
        env:
          OVERALL: ${{ needs.verificar.outputs.overall }}
        run: echo diagnostico

  publicar:
    name: Publicar no GitHub Pages
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        run: echo deploy-pulado

  # ---------------------------------------------------------------------
  # Alarme. Dispara em TRÊS situações — a terceira é a que quase todo monitor
  # esquece: quando o próprio monitor quebra, ele fica em silêncio.
  # ---------------------------------------------------------------------
  alertar:
    name: Alertar
    needs: [verificar, persistir, publicar]
    if: >-
      always() && (
        needs.verificar.result != 'success' ||
        needs.persistir.result == 'failure' ||
        needs.publicar.result == 'failure' ||
        needs.verificar.outputs.alarm == 'true'
      )
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Montar mensagem
        id: msg
        env:
          VERIFICAR: ${{ needs.verificar.result }}
          PERSISTIR: ${{ needs.persistir.result }}
          PUBLICAR: ${{ needs.publicar.result }}
          RESUMO: ${{ needs.verificar.outputs.resumo }}
        run: echo diagnostico

      - name: Sinalizar falha no dead-man's switch
        if: env.HEARTBEAT_URL != ''
        continue-on-error: true
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          TEXTO: ${{ steps.msg.outputs.texto }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: echo diagnostico

      - name: Enviar webhook
        if: env.MONITOR_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          MONITOR_WEBHOOK_URL: ${{ secrets.MONITOR_WEBHOOK_URL }}
          TEXTO: ${{ steps.msg.outputs.texto }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: echo diagnostico

      - name: Marcar execução como falha visível
        env:
          TEXTO: ${{ steps.msg.outputs.texto }}
        run: echo diagnostico
